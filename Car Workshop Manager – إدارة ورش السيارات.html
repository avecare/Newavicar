<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Car Workshop Manager – إدارة ورش السيارات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout concept: RTL shop-floor console. Sidebar on the right (desktop) / bottom tabs (phone),
   job-card lists, one dominant profit figure per screen. Hazard-stripe detail marks the brand. */
:root{
  --bg:#0c0d0f; --bg2:#121316; --sf:#17191c; --sf2:#1e2125; --sf3:#272b30;
  --ln:#2b2f35; --ln2:#3d424a;
  --ink:#eeeae2; --ink2:#b9b5ac; --ink3:#8d8981;
  --ac:#ff7a1a; --ac-h:#ff9040; --ac-ink:#1b0f04; --ac2:#ffc531;
  --good:#3fcf8e; --bad:#ff6363; --warn:#ffc531; --info:#7d9fdc;
  --c-rev:#e86a12; --c-exp:#6c90d3; --c-net:#eeeae2;
  --st-recv:#8aa2c8; --st-work:#ff7a1a; --st-parts:#ffc531; --st-ready:#3fcf8e; --st-done:#8d8981;
  --r:12px; --r-s:8px;
  --f-disp:'Reem Kufi','Cairo','Segoe UI',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);min-height:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cu{color:var(--ink3);font-size:.78em;font-weight:500;margin-inline-start:.25em}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hide{display:none!important}
.grow{flex:1;min-width:0}
.ic{flex:none;display:inline-block;vertical-align:middle}

/* shell */
#app{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none;flex:none;width:248px;background:var(--bg2);border-inline-end:1px solid var(--ln);position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column}
.hazard{height:8px;background:repeating-linear-gradient(135deg,var(--ac) 0 10px,#0c0d0f 10px 20px)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 18px/1.2 var(--f-disp);letter-spacing:.01em}
.brand small{display:block;color:var(--ink3);font:500 11px/1.4 var(--f-mono);letter-spacing:.04em;direction:ltr;text-align:right}
.nav{display:flex;flex-direction:column;gap:4px;padding:8px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-s);color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sf2);color:var(--ink)}
.nav a[aria-current=page]{background:var(--sf3);color:var(--ink);box-shadow:inset -3px 0 0 var(--ac)}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:10px}
.side-foot .small{color:var(--ink3);font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.top .hazard{height:4px}
.top-in{display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 10px var(--gut-l);max-width:1240px;margin:0 auto;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top-brand{display:flex;align-items:center;gap:10px;font:700 16px var(--f-disp)}
.top-brand .brand-mark{width:34px;height:34px;border-radius:8px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf);padding:0 44px 0 16px;outline:none}
.search input:focus{border-color:var(--ac)}
.search .ic{position:absolute;inset-inline-start:14px;top:12px;color:var(--ink3);pointer-events:none}
.sres{position:absolute;inset-inline:0;top:50px;background:var(--sf2);border:1px solid var(--ln2);border-radius:var(--r);max-height:60vh;overflow:auto;z-index:40;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:6px}
.sres h5{margin:8px 10px 4px;font-size:12px;color:var(--ink3);font-weight:600}
.sres button{display:flex;width:100%;text-align:start;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:var(--r-s);cursor:pointer}
.sres button:hover,.sres button:focus-visible{background:var(--sf3)}
.content{width:100%;max-width:1240px;margin:0 auto;padding:20px var(--gut-r) 120px var(--gut-l);display:flex;flex-direction:column;gap:20px}
.tabbar{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--bg2);border-top:1px solid var(--ln);padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:560px;margin:0 auto;align-items:center}
.tabbar a,.tabbar button.tab-add{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);text-decoration:none;font-size:11px;font-weight:500;border-radius:10px;background:none;border:0;cursor:pointer}
.tabbar a[aria-current=page]{color:var(--ac)}
.tabbar .tab-add .plus{width:50px;height:50px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(255,122,26,.35),0 0 0 5px var(--bg2)}
.tabbar .tab-add span{margin-top:-2px}
@media (min-width:960px){
  .side{display:flex}.tabbar,.top-brand{display:none}
  .content{padding-bottom:60px}
}

/* type */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font:700 26px/1.25 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.ph p{color:var(--ink3);font-size:14px}
h2.sec{font:700 18px/1.3 var(--f-disp);display:flex;align-items:center;gap:8px}
h2.sec small{font:500 12px var(--f-body);color:var(--ink3)}
.label{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-s);border:1px solid var(--ln2);background:var(--sf2);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sf3);border-color:#4a5058}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.primary:hover{background:var(--ac-h);border-color:var(--ac-h)}
.btn.good{background:#17402f;border-color:#235c44;color:#b8f2d6}
.btn.danger{background:transparent;border-color:#5b2a2d;color:#ff9a9a}
.btn.danger:hover{background:#2a1618}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.xl{min-height:64px;padding:0 22px;font-size:17px;border-radius:var(--r);flex:1;min-width:150px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:var(--r-s);border:1px solid transparent;background:none;color:var(--ink2);cursor:pointer}
.icon-btn:hover{background:var(--sf3);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}

/* cards & tiles */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.card.flat{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g3{grid-template-columns:minmax(0,1fr)}.btn.xl{min-height:56px;font-size:16px}}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font:600 22px/1.2 var(--f-mono);direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile .v .cu{font:500 12px var(--f-body)}
.tile .s{font-size:12px;color:var(--ink3)}
.hero{grid-column:span 2;background:linear-gradient(160deg,#241a10 0,var(--sf) 62%);border-color:#4a3320}
.hero .v{font-size:34px}
.hero .label{color:#d9b48f}
@media (max-width:520px){.hero{grid-column:span 2}.tile .v{font-size:19px}.hero .v{font-size:28px}}

/* chips pills */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf);color:var(--ink2);font-weight:500;font-size:13px;cursor:pointer}
.chip:hover{border-color:#555b64;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:700}
.chip .n{font:500 11px var(--f-mono);opacity:.8}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf3);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--ink3))}
.st-received{--pc:var(--st-recv)}.st-working{--pc:var(--st-work)}.st-parts{--pc:var(--st-parts)}.st-ready{--pc:var(--st-ready)}.st-delivered{--pc:var(--st-done)}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:2px 12px;border-radius:6px;background:#efe9d7;color:#14110a;border:2px solid #14110a;outline:1px solid #efe9d7;font:600 15px/1.5 var(--f-mono);letter-spacing:.06em;direction:ltr;white-space:nowrap}
.plate.none{background:transparent;color:var(--ink3);border-style:dashed;border-color:var(--ln2);outline:0;font:500 12px var(--f-body);letter-spacing:0}
.plate.xl{font-size:22px;padding:4px 18px;min-width:130px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35);vertical-align:-1px}

/* job card */
.job{display:flex;flex-direction:column;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:start;width:100%;min-width:0;transition:border-color .15s,background .15s}
.job:hover{border-color:#555b64;background:var(--sf2)}
.job-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.job-t{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.job-s{color:var(--ink3);font-size:13px;overflow-wrap:anywhere}
.job-f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--ln2);padding-top:10px}
.job-f div{min-width:0}
.job-f .label{display:block}
.job-f .num{font-size:14px;font-weight:600}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf)}
.tw.bare{border:0;border-radius:0;background:none}
table.t{border-collapse:collapse;width:100%;min-width:560px}
table.t th{background:var(--sf2);color:var(--ink2);font-weight:600;font-size:12.5px;text-align:start;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--ln2)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--ln);font-size:14px;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:left;direction:ltr;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th.n{font-family:var(--f-body);text-align:left}
table.t tfoot td{background:var(--sf2);font-weight:700;border-top:2px solid var(--ln2)}
table.t tbody tr.clk{cursor:pointer}
table.t tbody tr.clk:hover td{background:var(--sf2)}
table.t .acts{white-space:nowrap;text-align:end;width:1%}
.empty{padding:34px 18px;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink2);font-size:16px}

/* forms */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg .full{grid-column:1/-1}
@media (max-width:520px){.fg{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lb{font-size:13px;color:var(--ink2);font-weight:500}
.f>label i{color:var(--ac);font-style:normal}
.in,.f input:not([type=checkbox]):not([type=file]):not([type=radio]),.f select,.f textarea{width:100%;min-height:46px;border-radius:var(--r-s);border:1px solid var(--ln2);background:var(--bg2);padding:8px 12px;outline:none;min-width:0}
.f textarea{min-height:88px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.f input.num{text-align:left}
.f .hint{font-size:12px;color:var(--ink3)}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(0% + 18px) 52%,calc(0% + 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
.fs{border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sf)}
.fs>legend,.fs-t{font:700 14px var(--f-disp);color:var(--ac2);padding:0 6px}
fieldset{margin:0;min-width:0}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.sw input{width:20px;height:20px;accent-color:var(--ac)}
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px dashed var(--ln2);border-radius:var(--r-s);padding:10px 14px;font-weight:600}
.live .num{font-size:18px;color:var(--ac2)}
.sugg{display:flex;flex-direction:column;border:1px solid var(--ln2);border-radius:var(--r-s);overflow:hidden;background:var(--sf2)}
.sugg button{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:0;background:none;text-align:start;cursor:pointer;border-bottom:1px solid var(--ln)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sf3)}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#15291f;border:1px solid #235c44;border-radius:var(--r-s);padding:8px 12px;font-weight:600}

/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet{background:var(--sf);border:1px solid var(--ln2);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;animation:rise .2s;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.wide{max-width:820px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--ln)}
.sh-h h3{font:700 18px var(--f-disp)}
.sh-b{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sh-f{position:sticky;bottom:-16px;margin:0 -18px -16px;padding:12px 18px;background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:10px;flex-wrap:wrap}
.sh-f .btn{flex:1;min-width:130px}
@media (min-width:700px){.ov{align-items:center;padding:20px}.sheet{border-radius:18px;max-height:90vh}}
.qa{display:grid;gap:10px}
.qa .btn{justify-content:flex-start;min-height:64px;font-size:17px;gap:14px}
#toasts{position:fixed;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (min-width:960px){#toasts{bottom:24px}}
.toast{background:var(--sf3);border:1px solid var(--ln2);border-inline-start:4px solid var(--good);padding:11px 16px;border-radius:var(--r-s);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:500;animation:rise .2s;max-width:520px}
.toast.err{border-inline-start-color:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#2a2112;border:1px solid #5d4519;border-radius:var(--r);padding:12px 16px}
.banner.bad{background:#2a1618;border-color:#5b2a2d}
.banner .grow{min-width:200px}

/* car page */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--r-s);border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink3);text-align:center;line-height:1.3}
.step i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ln2);display:block}
.step.done{color:var(--ink2)} .step.done i{background:var(--ln2)}
.step.cur{border-color:var(--pc);color:var(--ink);background:var(--sf2)} .step.cur i{background:var(--pc);border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 25%,transparent)}
@media (max-width:520px){.step{font-size:11px;padding:8px 2px}}
.pnl{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.pnl{grid-template-columns:repeat(2,minmax(0,1fr))}.pnl .big{grid-column:1/-1}}
.pnl .big .v{font:700 36px/1.15 var(--f-mono);direction:ltr;text-align:right}
.pnl .v{font:600 20px/1.2 var(--f-mono);direction:ltr;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--sf3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 18px}
.kv div{min-width:0}.kv .label{display:block;margin-bottom:2px}.kv b{font-weight:600;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.ph-i{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--ln2);background:var(--bg2);cursor:pointer;padding:0}
.ph-i img{width:100%;height:100%;object-fit:cover;display:block}
.ph-i span{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.7);font-size:11px;padding:1px 8px;border-radius:99px}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--ln2);cursor:pointer;display:block}
.lbx{display:flex;flex-direction:column;gap:12px;align-items:center}
.lbx img{max-width:100%;max-height:68vh;border-radius:var(--r-s)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r-s);padding:3px;gap:2px}

(function () {
'use strict';
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

/* =============================================================
   أدوات عامة
   ============================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AR_DIG = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9', '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9' };
const latin = s => String(s ?? '').replace(/[٠-٩۰-۹]/g, d => AR_DIG[d]);
function parseNum(v) {
  let s = latin(v).replace(/\s/g, '').replace(/٫/g, '.').replace(/٬/g, ',');
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
  else if (s.includes(',')) {
    const p = s.split(',');
    if (p.length === 2 && p[1].length !== 3) s = p[0] + '.' + p[1]; else s = s.replace(/,/g, '');
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
const r3 = x => Math.round((Number(x) || 0) * 1000 + (x < 0 ? -1e-7 : 1e-7)) / 1000;
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = String(iso).split('-'); return `${d}/${m}/${y}`; }
const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
const MONTHS_S = ['ك2', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'ت1', 'ت2', 'ك1'];
const monthLabel = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + y; };
function dayDiff(iso) { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return Math.floor((Date.now() - new Date(y, m - 1, d).getTime()) / 864e5); }
function norm(s) {
  return latin(s).toLowerCase().replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
}
const normPlate = s => latin(s).toLowerCase().replace(/[\s\-_.\/]/g, '');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const LRI = s => s ? '\u2066' + s + '\u2069' : '';
const sum = (arr, f) => r3(arr.reduce((a, x) => a + (f ? f(x) : x), 0));

/* أيقونات */
const ICONS = {

  file: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6"/><path d="M10 17h6"/>',
  table: '<rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M3.5 10h17"/><path d="M10 5v14"/>',
  back: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.75 4.75 0 0 1 0 9.5z"/>',
  db: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  tag: '<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
  logo: '<path d="M3 15l2-6a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 9l2 6v3h-2v-2H5v2H3z" stroke-width="2"/><circle cx="7.5" cy="13" r="1.2"/><circle cx="16.5" cy="13" r="1.2"/>',
  wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5l3 3"/>'
};
const ic = (n, s = 20) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* =============================================================
   الثوابت
   ============================================================= */
const STATUSES = [
  { k: 'received', t: 'مستلمة' },
  { k: 'working', t: 'قيد العمل' },
  { k: 'parts', t: 'بانتظار القطع' },
  { k: 'ready', t: 'جاهزة للتسليم' },
  { k: 'delivered', t: 'تم التسليم' }
];
const ST = Object.fromEntries(STATUSES.map(s => [s.k, s.t]));
const CATS = ['قطع غيار', 'مواد سمكرة', 'مواد دهان وبويه', 'معجون وصنفرة', 'أجور عمال', 'أجور كهرباء أو ميكانيك خارجية', 'مصاريف نقل', 'مصاريف أخرى', 'إيجار وفواتير الورشة'];
const METHODS = [{ k: 'cash', t: 'نقداً' }, { k: 'bank', t: 'تحويل بنكي' }, { k: 'wallet', t: 'محفظة إلكترونية' }];
const METH = Object.fromEntries(METHODS.map(m => [m.k, m.t]));
const PTYPES = [{ k: 'advance', t: 'دفعة مقدمة' }, { k: 'partial', t: 'دفعة جزئية' }, { k: 'final', t: 'دفعة نهائية' }];
const PTYPE = Object.fromEntries(PTYPES.map(m => [m.k, m.t]));
const CURRENCIES = [
  { c: 'JOD', s: 'د.أ', n: 'دينار أردني', d: 3 }, { c: 'USD', s: '$', n: 'دولار أمريكي', d: 2 }, { c: 'SAR', s: 'ر.س', n: 'ريال سعودي', d: 2 },
  { c: 'AED', s: 'د.إ', n: 'درهم إماراتي', d: 2 }, { c: 'KWD', s: 'د.ك', n: 'دينار كويتي', d: 3 }, { c: 'QAR', s: 'ر.ق', n: 'ريال قطري', d: 2 },
  { c: 'OMR', s: 'ر.ع', n: 'ريال عماني', d: 3 }, { c: 'BHD', s: 'د.ب', n: 'دينار بحريني', d: 3 }, { c: 'EGP', s: 'ج.م', n: 'جنيه مصري', d: 2 },
  { c: 'ILS', s: '₪', n: 'شيكل', d: 2 }, { c: 'IQD', s: 'د.ع', n: 'دينار عراقي', d: 0 }, { c: 'LBP', s: 'ل.ل', n: 'ليرة لبنانية', d: 0 },
  { c: 'SYP', s: 'ل.س', n: 'ليرة سورية', d: 0 }, { c: 'TRY', s: '₺', n: 'ليرة تركية', d: 2 }, { c: 'EUR', s: '€', n: 'يورو', d: 2 }, { c: 'CUSTOM', s: '', n: 'عملة أخرى', d: 2 }
];
const COLOR_MAP = { 'أبيض': '#f4f4f2', 'ابيض': '#f4f4f2', 'أسود': '#161616', 'اسود': '#161616', 'فضي': '#b9bcc0', 'رمادي': '#7d8085', 'رصاصي': '#6b6f75', 'أحمر': '#d12d2d', 'احمر': '#d12d2d', 'أزرق': '#2f5fc4', 'ازرق': '#2f5fc4', 'أخضر': '#2f8f4f', 'اخضر': '#2f8f4f', 'أصفر': '#e8c630', 'اصفر': '#e8c630', 'برتقالي': '#ee7a1c', 'بني': '#6b4a2e', 'ذهبي': '#c9a24a', 'بيج': '#d8c7a3', 'كحلي': '#1d2b53', 'عنابي': '#6b1f2f', 'بنفسجي': '#6a3fa0', 'وردي': '#e58aa8', 'زيتي': '#5d6b34', 'سماوي': '#5bb7e6', 'نحاسي': '#a8643a', 'شمبانيا': '#d9c59a' };
const colorDot = name => { const n = norm(name || ''); for (const k of Object.keys(COLOR_MAP)) if (n.includes(norm(k))) return COLOR_MAP[k]; return ''; };

/* =============================================================
   قاعدة البيانات الدائمة (IndexedDB)
   ============================================================= */
const IDB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('car-workshop-manager', 1);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          ['customers', 'cars', 'expenses', 'payments', 'photos', 'photoData'].forEach(n => db.createObjectStore(n, { keyPath: 'id' }));
          db.createObjectStore('meta', { keyPath: 'key' });
        };
        rq.onsuccess = () => { IDB.db = rq.result; IDB.ok = true; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!IDB.ok) return res(undefined);
      try {
        const tx = IDB.db.transaction(store, mode);
        const st = tx.objectStore(store);
        let out;
        const r = fn(st);
        if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
        tx.oncomplete = () => res(out);
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error);
      } catch (e) { rej(e); }
    });
  },
  all: s => IDB.run(s, 'readonly', st => st.getAll()).then(v => v || []),
  get: (s, id) => IDB.run(s, 'readonly', st => st.get(id)),
  put: (s, v) => IDB.run(s, 'readwrite', st => st.put(v)),
  del: (s, id) => IDB.run(s, 'readwrite', st => st.delete(id)),
  clear: s => IDB.run(s, 'readwrite', st => st.clear()),
  putMany: (s, arr) => IDB.run(s, 'readwrite', st => { arr.forEach(v => st.put(v)); })
};

/* =============================================================
   الحالة
   ============================================================= */
const DEFAULTS = { workshop: '', phone: '', address: '', currency: 'JOD', symbol: 'د.أ', decimals: 3, receiptNo: 1001, lastBackup: '', cloudAuto: false, cloudAt: '' };
const S = { customers: [], cars: [], expenses: [], payments: [], photos: [], settings: { ...DEFAULTS } };
const X = {};
const UI = { storage: 'pending', persisted: null, dashPeriod: 'month', chartN: 6, chartTable: false, carQ: '', carF: 'all', carDebt: false, custQ: '', rep: 'profit', repFrom: '', repTo: '', repStatus: 'all', repPer: 'month', repCar: 'all' };

function reindex() {
  X.cust = new Map(S.customers.map(c => [c.id, c]));
  X.car = new Map(S.cars.map(c => [c.id, c]));
  X.expByCar = new Map(); X.payByCar = new Map(); X.carsByCust = new Map(); X.photosByRef = new Map(); X.fin = new Map();
  S.expenses.forEach(e => { const k = e.carId || '_general'; if (!X.expByCar.has(k)) X.expByCar.set(k, []); X.expByCar.get(k).push(e); });
  S.payments.forEach(p => { if (!X.payByCar.has(p.carId)) X.payByCar.set(p.carId, []); X.payByCar.get(p.carId).push(p); });
  S.cars.forEach(c => { if (!X.carsByCust.has(c.customerId)) X.carsByCust.set(c.customerId, []); X.carsByCust.get(c.customerId).push(c); });
  S.photos.forEach(p => { if (!X.photosByRef.has(p.refId)) X.photosByRef.set(p.refId, []); X.photosByRef.get(p.refId).push(p); });
  for (const arr of X.expByCar.values()) arr.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
  for (const arr of X.payByCar.values()) arr.sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.createdAt - b.createdAt);
}
function fin(car) {
  let f = X.fin.get(car.id);
  if (f) return f;
  const base = car.lump ? r3(car.agreed) : r3(r3(car.bodyFee) + r3(car.paintFee));
  const extra = r3(car.extraFee), disc = r3(car.discount);
  const due = r3(base + extra - disc);
  const exps = X.expByCar.get(car.id) || [], pays = X.payByCar.get(car.id) || [];
  const expenses = sum(exps, e => e.amount), paid = sum(pays, p => p.amount);
  f = { base, extra, disc, due, paid, remaining: r3(due - paid), expenses, net: r3(due - expenses), cash: r3(paid - expenses), exps, pays };
  X.fin.set(car.id, f);
  return f;
}
function totals() {
  const cars = S.cars;
  const revenue = sum(cars, c => fin(c).due);
  const expAll = sum(S.expenses, e => e.amount);
  const general = sum(X.expByCar.get('_general') || [], e => e.amount);
  const paid = sum(S.payments, p => p.amount);
  const receivable = sum(cars, c => Math.max(0, fin(c).remaining));
  return { revenue, expAll, general, paid, receivable, net: r3(revenue - expAll), cash: r3(paid - expAll) };
}
const custName = id => (X.cust.get(id) || {}).name || '—';
const carTitle = c => [c.make, c.model, c.year].filter(Boolean).join(' ') || 'سيارة';
const carLabel = c => `${carTitle(c)}${c.plate ? ' · ' + LRI(c.plate) : ''} · ${custName(c.customerId)}`;

/* التنسيق المالي */
function money(n) {
  const d = S.settings.decimals;
  const v = Number(n) || 0;
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  return (v < 0 && Math.abs(v) >= Math.pow(10, -d) / 2 ? '-' : '') + s;
}
const sym = () => S.settings.symbol || S.settings.currency;
const cur = (n, cls = '') => `<span class="num ${cls}">${money(n)}</span><span class="cu">${esc(sym())}</span>`;
const curTone = n => cur(n, n > 0 ? 'pos' : n < 0 ? 'neg' : '');

/* =============================================================
   الحفظ
   ============================================================= */
const hooks = { after: () => { } };
async function persist(store, obj, touch = true) {
  if (touch) obj.updatedAt = Date.now();
  const arr = S[store];
  const i = arr.findIndex(x => x.id === obj.id);
  if (i < 0) arr.push(obj); else arr[i] = obj;
  try { await IDB.put(store, obj); } catch (e) { toast('تعذر الحفظ في قاعدة البيانات: ' + (e && e.message || e), 'err'); }
  reindex(); hooks.after();
}

async function canvasesToPdf(canvases) {

  offs[1] = off; str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = off; str(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${canvases.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] >>\nendobj\n`);
  canvases.forEach((c, i) => {
    const wpt = (c.width / 150 * 72).toFixed(2), hpt = (c.height / 150 * 72).toFixed(2);
    const po = 3 + i * 3, co = po + 1, io = po + 2;
    offs[po] = off; str(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt} ${hpt}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    const content = `q ${wpt} 0 0 ${hpt} 0 0 cm /Im0 Do Q`;
    offs[co] = off; str(`${co} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    offs[io] = off; str(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgs[i].length} >>\nstream\n`);
    push(jpgs[i]); str('\nendstream\nendobj\n');
  });

  let x = `xref\n0 ${count}\n0000000000 65535 f \n`;
  for (let i = 1; i < count; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  x += `trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`;
  str(x);

}

/* ---------- الصور ---------- */
async function processImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('تعذر قراءة الصورة')); i.src = url; });
    const draw = (max, q) => {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    };
    return { full: draw(1280, .74), thumb: draw(280, .7) };
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(refType, refId, files, phase) {
  const out = [];
  for (const f of Array.from(files || [])) {
    if (!f.type.startsWith('image/')) continue;
    try {
      const { full, thumb } = await processImage(f);
      const rec = { id: uid(), refType, refId, phase, thumb, createdAt: Date.now(), updatedAt: Date.now() };
      MEMFULL.set(rec.id, full);
      try { await IDB.put('photoData', { id: rec.id, full }); await IDB.put('photos', rec); } catch (e) { toast('تعذر حفظ الصورة', 'err'); }
      S.photos.push(rec); out.push(rec);
    } catch (e) { toast('تعذر قراءة إحدى الصور (جرّب صيغة JPG أو PNG)', 'err'); }
  }

function wirePricing(root, p) {
  const calc = () => {
    const lump = root.querySelector('#' + p + '-lump').checked;
    root.querySelectorAll('[data-p=lump]').forEach(e => e.hidden = !lump);
    root.querySelectorAll('[data-p=split]').forEach(e => e.hidden = lump);
    const g = id => { const n = numVal(root, id); return Number.isFinite(n) ? n : 0; };
    const base = lump ? g(p + '-agreed') : g(p + '-body') + g(p + '-paint');
    root.querySelector('#' + p + '-due').textContent = money(r3(base + g(p + '-extra') - g(p + '-disc')));
  };
  root.addEventListener('input', e => { if (e.target.id && e.target.id.startsWith(p + '-')) calc(); });
  root.addEventListener('change', e => { if (e.target.id === p + '-lump') calc(); });
  calc();
}
function readPricing(root, p) {
  const lump = root.querySelector('#' + p + '-lump').checked;
  const o = { lump, agreed: numVal(root, p + '-agreed'), bodyFee: numVal(root, p + '-body'), paintFee: numVal(root, p + '-paint'), extraFee: numVal(root, p + '-extra'), discount: numVal(root, p + '-disc') };
  if (Object.values(o).some(v => typeof v === 'number' && Number.isNaN(v))) return null;
  if ([o.agreed, o.bodyFee, o.paintFee, o.extraFee, o.discount].some(v => v < 0)) return null;
  return o;
}

/* =============================================================
   النسخ الاحتياطي والاستعادة
   ============================================================= */
async function backupObject(withPhotos = true) {
  const photos = [];
  if (withPhotos) for (const p of S.photos) { const full = await getFull(p.id); photos.push({ ...p, full: full || p.thumb }); }
  return { app: 'car-workshop-manager', v: 1, exportedAt: new Date().toISOString(), settings: S.settings, customers: S.customers, cars: S.cars, expenses: S.expenses, payments: S.payments, photos };
}
async function doBackup() {
  try {
    const obj = await backupObject(true);
    const ok = await deliver(`نسخة-احتياطية-الورشة-${fileStamp()}.json`, new Blob([JSON.stringify(obj)], { type: 'application/json' }), 'النسخة الاحتياطية');
    if (ok) { S.settings.lastBackup = new Date().toISOString(); await saveSettings(); render(); }
  } catch (e) { toast('تعذر إنشاء النسخة الاحتياطية: ' + (e && e.message || e), 'err'); }
}
function validBackup(o) { return o && o.app === 'car-workshop-manager' && ['customers', 'cars', 'expenses', 'payments'].every(k => Array.isArray(o[k])); }
async function applyBackup(o, keepPhotosIfMissing) {
  const photosIn = Array.isArray(o.photos) ? o.photos : [];
  for (const s of ['customers', 'cars', 'expenses', 'payments']) await IDB.clear(s);
  if (!keepPhotosIfMissing) { await IDB.clear('photos'); await IDB.clear('photoData'); MEMFULL.clear(); }
  S.customers = o.customers; S.cars = o.cars; S.expenses = o.expenses; S.payments = o.payments;
  if (!keepPhotosIfMissing) {
    S.photos = photosIn.map(p => { const { full, ...meta } = p; if (full) MEMFULL.set(p.id, full); return meta; });
    await IDB.putMany('photos', S.photos);
    await IDB.putMany('photoData', photosIn.filter(p => p.full).map(p => ({ id: p.id, full: p.full })));
  }
  await IDB.putMany('customers', S.customers); await IDB.putMany('cars', S.cars); await IDB.putMany('expenses', S.expenses); await IDB.putMany('payments', S.payments);
  S.settings = Object.assign({}, DEFAULTS, o.settings || {}, { lastBackup: S.settings.lastBackup });
  const maxNo = S.payments.reduce((a, p) => Math.max(a, p.no || 0), 0); if (S.settings.receiptNo <= maxNo) S.settings.receiptNo = maxNo + 1;
  await IDB.put('meta', { key: 'settings', value: S.settings });
  reindex(); render();
}
async function restoreFromFile(file) {
  let o; try { o = JSON.parse(await file.text()); } catch (e) { return toast('الملف ليس نسخة احتياطية صالحة', 'err'); }
  if (!validBackup(o)) return toast('هذا الملف ليس نسخة احتياطية من هذا التطبيق', 'err');
  const msg = `سيتم استبدال كل البيانات الحالية (${S.cars.length} سيارة، ${S.customers.length} زبون) ببيانات النسخة (${o.cars.length} سيارة، ${o.customers.length} زبون، تاريخ النسخة ${fmtDate(String(o.exportedAt || '').slice(0, 10))}). هل تريد المتابعة؟`;
  if (!await confirmBox({ title: 'استعادة نسخة احتياطية', msg, ok: 'استبدال واستعادة', danger: true })) return;
  try { await applyBackup(o, false); toast('تمت استعادة البيانات بنجاح'); go('dashboard'); } catch (e) { toast('فشلت الاستعادة: ' + (e && e.message || e), 'err'); }
}

/* النسخة السحابية (اختيارية) — بدون الصور */
const CHUNK = 70000;
async function cloudDb() { try { return (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch (e) { return null; } }
async function cloudSave() {
  const db = await cloudDb(); if (!db) throw new Error('الحفظ السحابي غير متاح في هذا العرض');
  const json = JSON.stringify(await backupObject(false));
  const parts = []; for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
  const col = db.collection('cloudbackup');
  const meta = await col.doc('meta').get(); const oldN = meta.exists ? (meta.data().parts || 0) : 0;
  for (let i = 0; i < parts.length; i++) await col.doc('p' + i).set({ i, data: parts[i] });
  await col.doc('meta').set({ parts: parts.length, savedAt: new Date().toISOString(), cars: S.cars.length, customers: S.customers.length, payments: S.payments.length, expenses: S.expenses.length });
  for (let i = parts.length; i < oldN; i++) await col.doc('p' + i).delete();
  S.settings.cloudAt = new Date().toISOString(); await saveSettings();
}
async function cloudRestore() {
  const db = await cloudDb(); if (!db) throw new Error('الحفظ السحابي غير متاح في هذا العرض');
  const col = db.collection('cloudbackup'); const meta = await col.doc('meta').get();
  if (!meta.exists) throw new Error('لا توجد نسخة سحابية محفوظة بعد');
  const n = meta.data().parts; let json = '';
  for (let i = 0; i < n; i++) { const d = await col.doc('p' + i).get(); if (!d.exists) throw new Error('النسخة السحابية غير مكتملة'); json += d.data().data; }
  const o = JSON.parse(json); if (!validBackup(o)) throw new Error('النسخة السحابية تالفة');
  return o;
}
const cloudSchedule = debounce(async () => { if (!S.settings.cloudAuto) return; try { await cloudSave(); } catch (e) { } if (location.hash === '#config') render(); }, 15000);

/* الرسم البياني (SVG حسب عرض الشاشة) */
function niceScale(min, max, n = 4) {
  if (max === min) max = min + 1;
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), nm = step0 / mag;
  const step = (nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v / step) * step);
  return { lo, hi, ticks };
}
const kfmt = v => Math.abs(v) >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v * 100) / 100);
function chartData() {
  return monthKeysBack(UI.chartN).map(k => { const s = periodStats(k + '-01', k + '-31'); return { k, inn: s.inn, out: s.out, net: s.cash }; });
}
function drawChart() {
  const box = $('#chart'); if (!box) return;
  const data = chartData();
  if (UI.chartTable) {
    box.innerHTML = `<div class="tw"><table class="t"><thead><tr><th>الشهر</th><th class="n">المقبوضات</th><th class="n">المصروفات</th><th class="n">الصافي</th></tr></thead><tbody>${data.slice().reverse().map(d => `<tr><td>${monthLabel(d.k)}</td><td class="n">${money(d.inn)}</td><td class="n">${money(d.out)}</td><td class="n ${d.net > 0 ? 'pos' : d.net < 0 ? 'neg' : ''}">${money(d.net)}</td></tr>`).join('')}</tbody></table></div>`;
    return;
  }
  const W = Math.max(280, box.clientWidth || 320), H = 260, ml = 46, mr = 8, mt = 12, mb = 30, pw = W - ml - mr, ph = H - mt - mb;
  const maxV = Math.max(0, ...data.map(d => Math.max(d.inn, d.out, d.net))), minV = Math.min(0, ...data.map(d => d.net));
  const sc = niceScale(minV, maxV === 0 && minV === 0 ? 1 : maxV);
  const Y = v => mt + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph, y0 = Y(0);
  const gw = pw / data.length, bw = Math.min(22, gw * .3);
  const X0 = i => ml + pw - (i + .5) * gw; // RTL: أقدم شهر على اليمين
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="رسم بياني شهري للمقبوضات والمصروفات والصافي">`;
  sc.ticks.forEach(v => { const y = Y(v); s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" stroke="var(--ln)" stroke-width="1"${v === 0 ? ' stroke-opacity="1" style="stroke:var(--ln2)"' : ' stroke-dasharray="3 4"'}/><text class="ax" x="${ml - 8}" y="${y + 4}" text-anchor="end">${kfmt(v)}</text>`; });
  const bar = (cx, v, color) => {
    if (v <= 0) return ''; const h = y0 - Y(v), r = Math.min(4, h / 2), x = cx - bw / 2;
    return `<path d="M${x},${y0} V${Y(v) + r} Q${x},${Y(v)} ${x + r},${Y(v)} H${x + bw - r} Q${x + bw},${Y(v)} ${x + bw},${Y(v) + r} V${y0} Z" fill="${color}"/>`;
  };
  data.forEach((d, i) => {
    const cx = X0(i); s += bar(cx + bw / 2 + 1, d.inn, 'var(--c-rev)') + bar(cx - bw / 2 - 1, d.out, 'var(--c-exp)');
    const [, m] = d.k.split('-'); s += `<text class="ax" x="${cx}" y="${H - 10}" text-anchor="middle">${MONTHS_S[+m - 1]}</text>`;
  });
  const pts = data.map((d, i) => `${X0(i)},${Y(d.net)}`).join(' ');
  s += `<polyline points="${pts}" fill="none" stroke="var(--c-net)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  data.forEach((d, i) => { const last = i === data.length - 1; s += `<circle cx="${X0(i)}" cy="${Y(d.net)}" r="${last ? 5 : 3.5}" fill="${last ? 'var(--c-net)' : 'var(--sf)'}" stroke="var(--c-net)" stroke-width="2"/>`; });
  s += `<g id="hl" style="display:none"><rect id="hlr" y="${mt}" height="${ph}" width="${gw}" fill="var(--c-net)" fill-opacity=".07"/></g></svg><div class="tip hide" id="tip"></div>`;
  box.innerHTML = s;
  const tip = $('#tip', box), hl = $('#hl', box), hlr = $('#hlr', box);
  const show = e => {
    const r = box.getBoundingClientRect(); const px = e.clientX - r.left; let i = Math.floor((ml + pw - px) / gw); if (i < 0 || i >= data.length) return hide();
    const d = data[i]; hl.style.display = ''; hlr.setAttribute('x', X0(i) - gw / 2);
    tip.classList.remove('hide'); tip.innerHTML = `<b>${monthLabel(d.k)}</b><div><span>المقبوضات</span><span class="num">${money(d.inn)}</span></div><div><span>المصروفات</span><span class="num">${money(d.out)}</span></div><div><span>الصافي</span><span class="num ${d.net < 0 ? 'neg' : 'pos'}">${money(d.net)}</span></div>`;
    const tw_ = tip.offsetWidth; let left = px - tw_ / 2; left = Math.max(0, Math.min(W - tw_, left)); tip.style.left = left + 'px'; tip.style.top = '0px';
  };
  const hide = () => { tip.classList.add('hide'); hl.style.display = 'none'; };
  box.addEventListener('pointermove', show); box.addEventListener('pointerdown', show); box.addEventListener('pointerleave', hide);
}

const NAV = [['dashboard', 'لوحة التحكم', 'home'], ['cars', 'السيارات', 'car'], ['customers', 'الزبائن', 'users'], ['reports', 'التقارير', 'chart'], ['config', 'الإعدادات', 'sliders']];
function parseRoute() {
  const h = (location.hash || '#dashboard').slice(1) || 'dashboard';
  if (h.startsWith('car-')) return { name: 'car', id: h.slice(4), h, nav: 'cars' };
  if (h.startsWith('cust-')) return { name: 'cust', id: h.slice(5), h, nav: 'customers' };
  const ok = NAV.some(n => n[0] === h); return ok ? { name: h, h, nav: h } : { name: 'dashboard', h: 'dashboard', nav: 'dashboard' };
}
function go(h) {
  if (location.hash.slice(1) === h) { render(); return; }
  location.hash = h;
  setTimeout(() => { if (UI.route !== h) render(); }, 60);
}
function renderNav(active) {
  $('#nav-side').innerHTML = NAV.map(([k, l, i]) => `<a href="#${k}" data-go="${k}" ${k === active ? 'aria-current="page"' : ''}>${ic(i, 20)} ${l}</a>`).join('');
  const t = NAV.filter(n => n[0] !== 'config');
  const link = ([k, l, i]) => `<a href="#${k}" data-go="${k}" ${k === active ? 'aria-current="page"' : ''}>${ic(i, 22)}<span>${l.replace('لوحة التحكم', 'الرئيسية')}</span></a>`;
  $('#nav-tabs').innerHTML = link(t[0]) + link(t[1]) + `<button type="button" class="tab-add" data-act="quick" aria-label="إضافة سريعة"><span class="plus">${ic('plus', 26)}</span><span>إضافة</span></button>` + link(t[2]) + link(t[3]);
  const cl = $('#cfg-link'); if (cl) cl.setAttribute('aria-current', active === 'config' ? 'page' : 'false');
}
function render() {
  const r = parseRoute(); const view = $('#view'); if (!view) return;
  const changed = UI.route !== r.h; UI.route = r.h;
  const fnMap = { dashboard: viewDashboard, cars: viewCars, customers: viewCustomers, reports: viewReports, config: viewConfig, car: () => viewCar(r.id), cust: () => viewCustomer(r.id) };
  let html; try { html = fnMap[r.name](); } catch (e) { console.error(e); html = `<div class="card"><div class="empty"><b>حدث خطأ أثناء عرض الصفحة</b><span>${esc(e && e.message)}</span></div></div>`; }
  view.innerHTML = html;
  renderNav(r.nav);
  $('#side-info').textContent = S.settings.workshop || '';
  if (r.name === 'dashboard') drawChart();
  if (changed) window.scrollTo(0, 0);
}

async function deleteCarCascade(id) {
  const exps = S.expenses.filter(e => e.carId === id), pays = S.payments.filter(p => p.carId === id);
  const phs = S.photos.filter(p => p.refId === id || exps.some(e => e.id === p.refId));
  for (const e of exps) { try { await IDB.del('expenses', e.id); } catch (x) { } }
  for (const p of pays) { try { await IDB.del('payments', p.id); } catch (x) { } }
  for (const p of phs) { MEMFULL.delete(p.id); try { await IDB.del('photos', p.id); await IDB.del('photoData', p.id); } catch (x) { } }
  try { await IDB.del('cars', id); } catch (x) { }
  S.expenses = S.expenses.filter(e => e.carId !== id); S.payments = S.payments.filter(p => p.carId !== id);
  S.photos = S.photos.filter(p => !phs.includes(p)); S.cars = S.cars.filter(c => c.id !== id);
  reindex(); hooks.after();
}

  Object.assign(S.settings, { workshop: val(form, 'sh-name'), phone: latin(val(form, 'sh-phone')), address: val(form, 'sh-addr') });
  await saveSettings(); toast('تم حفظ بيانات الورشة');
};
FORMS.currency = async form => {
  const code = val(form, 'cc-cur'); const preset = CURRENCIES.find(c => c.c === code) || CURRENCIES[0];
  Object.assign(S.settings, { currency: code, symbol: val(form, 'cc-sym') || preset.s || code, decimals: Math.max(0, Math.min(3, parseInt(val(form, 'cc-dec'), 10) || 0)) });
  await saveSettings(); toast('تم حفظ العملة');
};

/* التقاط الأحداث */
document.addEventListener('click', e => {
  const t = e.target; let el;
  if ((el = t.closest('[data-act]'))) { e.preventDefault(); const f = ACT[el.dataset.act]; if (f) f(el, e); return; }
  if ((el = t.closest('[data-photo]'))) { e.preventDefault(); openPhoto(el.dataset.photo); return; }
  if ((el = t.closest('[data-cf]'))) { e.preventDefault(); UI.carF = el.dataset.cf; go('cars'); return; }
  if ((el = t.closest('[data-status]'))) {
    const c = X.car.get(el.dataset.id); const k = el.dataset.status; if (!c || c.status === k) return;
    const n = { ...c, status: k, deliveredDate: k === 'delivered' ? todayISO() : '' };
    persist('cars', n).then(() => { const r = fin(n).remaining; toast(`الحالة: ${ST[k]}` + (k === 'delivered' && r > 0 ? ` — بقي على الزبون ${money(r)} ${sym()}` : '')); });
    return;
  }
  if ((el = t.closest('[data-per]'))) { UI.dashPeriod = el.dataset.per; render(); return; }
  if ((el = t.closest('[data-cn]'))) { UI.chartN = +el.dataset.cn; render(); return; }
  if ((el = t.closest('[data-rep]'))) { UI.rep = el.dataset.rep; render(); return; }
  if ((el = t.closest('[data-range]'))) { setRange(el.dataset.range); render(); return; }
  if ((el = t.closest('[data-repper]'))) { UI.repPer = el.dataset.repper; render(); return; }
  if ((el = t.closest('[data-go]'))) { e.preventDefault(); go(el.dataset.go); return; }
  if (!t.closest('.search')) hideSearch();
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const h = FORMS[f.dataset.form]; if (h) { try { await h(f, e); } catch (err) { console.error(err); toast('حدث خطأ: ' + (err && err.message || err), 'err'); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cq') { UI.carQ = t.value; $('#carlist').innerHTML = carListHtml(); }
  else if (t.id === 'cuq') { UI.custQ = t.value; $('#custlist').innerHTML = custListHtml(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'rf-from') { UI.repFrom = t.value; render(); }
  else if (t.id === 'rf-to') { UI.repTo = t.value; render(); }
  else if (t.id === 'rf-status') { UI.repStatus = t.value; render(); }
  else if (t.id === 'rf-car') { UI.repCar = t.value; render(); }
  else if (t.id === 'restore-file') { const f = t.files[0]; t.value = ''; if (f) restoreFromFile(f); }
  else if (t.id === 'cc-cur') { const p = CURRENCIES.find(c => c.c === t.value); if (p) { const f = t.closest('form'); f.querySelector('#cc-sym').value = p.s; f.querySelector('#cc-dec').value = String(p.d); } }
  else if (t.id === 'cloud-auto') {
    S.settings.cloudAuto = t.checked; await saveSettings();
    if (t.checked) { try { await cloudSave(); toast('تم تفعيل الحفظ السحابي التلقائي'); } catch (err) { S.settings.cloudAuto = false; await saveSettings(); toast('تعذر تفعيل الحفظ السحابي: ' + ((err && (err.message || err.code)) || ''), 'err'); } }
  } else if (t.dataset && t.dataset.addphoto) {
    const files = t.files, id = t.dataset.id, ph = t.dataset.addphoto;
    if (files && files.length) { toast('جاري معالجة الصور…'); const r = await addPhotos('car', id, files, ph); if (r.length) toast(`تمت إضافة ${r.length} صورة`); }
    t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (MODALS.length) closeTop(); else hideSearch(); } });
window.addEventListener('hashchange', () => render());

/* البحث العام */
function hideSearch() { const r = $('#sres'); if (r) r.classList.add('hide'); }
function runSearch() {
  const q = $('#gs').value, box = $('#sres');
  const nq = norm(q).trim(), qp = normPlate(q), qd = latin(q).replace(/\D/g, '');
  if (!nq && !qp) return hideSearch();
  const phoneOf = id => latin((X.cust.get(id) || {}).phone || '').replace(/\D/g, '');
  const cars = S.cars.filter(c => (qp && normPlate(c.plate || '').includes(qp)) || norm([c.make, c.model, c.color, custName(c.customerId)].join(' ')).includes(nq) || (qd.length >= 3 && phoneOf(c.customerId).includes(qd))).slice(0, 8);
  const custs = S.customers.filter(c => norm(c.name).includes(nq) || (qd.length >= 3 && phoneOf(c.id).includes(qd))).slice(0, 6);
  let h = '';
  if (cars.length) h += `<h5>السيارات</h5>` + cars.map(c => `<button type="button" data-go="car-${c.id}" data-sr>${plateChip(c)}<span class="grow"><b>${esc(carTitle(c))}</b><br><span class="muted">${esc(custName(c.customerId))}</span></span>${statusPill(c.status)}</button>`).join('');
  if (custs.length) h += `<h5>الزبائن</h5>` + custs.map(c => `<button type="button" data-go="cust-${c.id}" data-sr>${ic('user', 18)}<span class="grow"><b>${esc(c.name)}</b></span><span class="num muted">${esc(c.phone || '')}</span></button>`).join('');
  box.innerHTML = h || `<div class="empty" style="padding:18px">لا توجد نتائج مطابقة</div>`; box.classList.remove('hide');
}
$('#gs').addEventListener('input', runSearch);
$('#gs').addEventListener('focus', () => { if ($('#gs').value) runSearch(); });
$('#gs').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('#sres [data-sr]'); if (b) { b.click(); } } });
$('#sres').addEventListener('click', e => { if (e.target.closest('[data-sr]')) { $('#gs').value = ''; hideSearch(); } });

/* التشغيل */

(async function boot() {
  $('#brand-mark').innerHTML = ic('logo', 26); $('#brand-mark2').innerHTML = ic('logo', 20);
  $('#search-ic').innerHTML = ic('search', 18); $('#cfg-link').innerHTML = ic('sliders', 22);
  $('#side-add').innerHTML = ic('plus', 18) + ' إضافة سريعة';
  reindex();
  render();
  await loadAll();
  render();
})();
if (window.__TEST__) window.__ws = { S, X, UI, fin, totals, buildReport, buildCarReport, buildCustomerReport, buildAllDataReports, buildPeriodicReport, renderReportPages, canvasesToPdf, buildXlsx, drawReceipt, addPayment, persist, parseNum, money, render, go, periodStats, backupObject, applyBackup, validBackup, setRange, addPhotos, openReceipt };
})();
