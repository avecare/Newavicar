<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تطبيقنا متاح الآن على Google Play!</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(to bottom, #f0f0f0, #e0ffe0);
      color: #333;
      text-align: center;
      padding: 50px 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
    h1 {
      color: #2e7d32;
      font-size: 24px;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #2e7d32;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" class="logo">
    <h1>تطبيقنا الآن على متجر Google Play!</h1>
    <p>احصل على آخر إصدار من التطبيق مباشرة من متجر جوجل بلاي واستمتع بالتحديثات الجديدة.</p>
    <a href="https://play.google.com/store/apps/details?id=splevdue.mo" target="_blank" class="btn">تحميل التطبيق الآن</a>
  </div>
</body>
</html>
